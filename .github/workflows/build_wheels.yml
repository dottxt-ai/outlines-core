name: Build Wheels

on:
  workflow_call:
    inputs:
      auto_bump:
        description: 'Bump version automatically'
        type: boolean
        required: false
        default: false

jobs:
  linux:
    name: Build ${{ matrix.platform.runner}} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          # Older ubuntu to avoid messing with glibc version since glibc is forward compatible,
          # but not backwards compatible (since about glibc 2.2 or 2.4)
          # All programs built against an older glibc work on a system with a newer glibc than
          # it was built with. The reverse is not true.
          - runner: ubuntu-22.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            manylinux: auto
            interpreter: "3.9 3.10 3.11 3.12 3.13 3.14 3.14t"
          - runner: ubuntu-22.04
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            manylinux: manylinux_2_28
            interpreter: "3.9 3.10 3.11 3.12 3.13 3.14 3.14t"
          - runner: ubuntu-22.04
            arch: riscv64
            target: riscv64gc-unknown-linux-gnu
            manylinux: manylinux_2_39
            interpreter: "3.9 3.10 3.11 3.12 3.13 3.14 3.14t"
          - runner: ubuntu-22.04
            arch: s390x
            target: s390x-unknown-linux-gnu
            manylinux: manylinux_2_28
            interpreter: "3.9 3.10 3.11 3.12 3.13 3.14 3.14t"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - run: pip install -U twine

      - name: Install required packages
        run: |
          sudo apt update
          sudo apt install pkg-config gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu gcc-s390x-linux-gnu g++-aarch64-linux-gnu g++-riscv64-linux-gnu g++-s390x-linux-gnu -qy

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          target: ${{ matrix.platform.target}}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Bump version in Cargo.toml
        if: ${{ inputs.auto_bump }}
        uses: ./.github/actions/bump_version

      - name: Set up QEMU
        if: ${{ !contains(matrix.platform.target, 'x86_64') }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ matrix.platform.interpreter }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: ${{ matrix.platform.manylinux }}

      - name: Validate Python package distributions
        run: twine check --strict dist/*

      - name: Install built wheel
        if: contains(matrix.platform.target, 'x86_64')
        run: |
          pip install outlines_core --no-index --find-links dist --force-reinstall
          cd outlines_core
          python -c "import outlines_core"

      - name: Smoke-test built wheel under QEMU
        if: contains(matrix.platform.target, 'aarch64') || contains(matrix.platform.target, 's390x')
        run: |
          docker run --rm --platform linux/${{ matrix.platform.arch == 'aarch64' && 'arm64' || matrix.platform.arch }} \
            -v "$PWD:/io" -w /io \
            python:3.12-slim bash -c "
              pip install --quiet pytest &&
              pip install --quiet outlines_core --no-index --find-links dist --force-reinstall &&
              pytest tests/test_imports.py tests/test_vocabulary.py -v --override-ini='filterwarnings='
            "

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          path: dist/*.whl
          name: wheels-linux-${{ matrix.platform.arch }}

  windows:
    name: Build ${{ matrix.platform.runner}} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x86
            alias-target: i686-pc-windows-msvc
            interpreter: "3.9 3.10 3.11 3.12 3.13 3.14 3.14t"
          - runner: windows-latest
            target: x64
            alias-target: x86_64-pc-windows-msvc
            interpreter: "3.9 3.10 3.11 3.12 3.13 3.14 3.14t"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          architecture: ${{ matrix.platform.target }}

      - run: pip install -U twine

      - name: Install required packages
        # rustls requires aws-lc-sys, which FFI bindings to AWS-LC (AWS Libcrypto)
        # aws-lc-sys requires nasm for compilation on windows
        run: |
          choco install nasm

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          target: ${{ matrix.platform.alias-target}}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Bump version in Cargo.toml
        if: ${{ inputs.auto_bump }}
        uses: ./.github/actions/bump_version

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ matrix.platform.interpreter }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto

      - name: Validate Python package distributions
        run: twine check --strict dist/*

      - name: Install built wheel
        run: |
          pip install outlines_core --no-index --find-links dist --force-reinstall
          cd outlines_core
          python -c "import outlines_core"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          path: dist/*.whl
          name: wheels-windows-${{ matrix.platform.target }}

  macos:
    name: Build ${{ matrix.platform.runner}} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-14
            target: x86_64
            macos_version: "14.0"
            interpreter: "3.9 3.10 3.11 3.12 3.13 3.14 3.14t"
          - runner: macos-14
            target: aarch64
            macos_version: "14.0"
            interpreter: "3.9 3.10 3.11 3.12 3.13 3.14 3.14t"
          - runner: macos-15
            target: x86_64
            macos_version: "15.0"
            interpreter: "3.9 3.10 3.11 3.12 3.13 3.14 3.14t"
          - runner: macos-15
            target: aarch64
            macos_version: "15.0"
            interpreter: "3.9 3.10 3.11 3.12 3.13 3.14 3.14t"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - run: pip install -U twine

      - name: Set macOS version
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.platform.macos_version }}" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          target: ${{ matrix.platform.target}}-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Bump version in Cargo.toml
        if: ${{ inputs.auto_bump }}
        uses: ./.github/actions/bump_version

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ matrix.platform.interpreter }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto

      - name: Validate Python package distributions
        run: twine check --strict dist/*

      - name: Install built wheel
        if: matrix.platform.target == 'aarch64'
        run: |
          pip install outlines_core --no-index --find-links dist --force-reinstall
          cd outlines_core
          python -c "import outlines_core"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          path: dist/*.whl
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}


  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'

      - name: Bump Cargo version
        if: ${{ inputs.auto_bump }}
        uses: ./.github/actions/bump_version

      - name: Build sdist with Maturin
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          path: dist/*.tar.gz
          name: sdist
