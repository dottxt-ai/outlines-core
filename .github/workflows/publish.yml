name: Publish PyPi & crates.io

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
  release:
    types:
      - created

jobs:
  build_wheels:
    uses: ./.github/workflows/build_wheels.yml
    with:
      auto_bump: true

  release:
    needs: build_wheels
    name: Publish PyPI and crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdist
          path: dist

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Bump version in Cargo.toml
        uses: ./.github/actions/bump_version

      - name: Dry-run publish to crates.io
        run: cargo publish --dry-run --allow-dirty

      - name: Print directory information
        run: |
          pwd
          ls -la
          ls -la dist

      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_SECRET}}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # We need --allow-dirty since we dynamically change the version in Cargo.toml
        run: cargo publish --allow-dirty
